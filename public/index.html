<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="calculator" role="main" aria-label="Calculator">
    <section class="display" aria-label="Calculator display">
      <div id="expression" class="display__expression" aria-live="polite" aria-label="Expression"></div>
      <div id="result" class="display__result" aria-live="polite" aria-label="Result">0</div>
    </section>

    <section class="button-grid" aria-label="Calculator buttons">
      <!-- Row 1 -->
      <button class="btn btn--special" data-value="AC" aria-label="Clear all">AC</button>
      <button class="btn btn--special" data-value="C" aria-label="Clear entry">C</button>
      <button class="btn btn--special" data-value="BACKSPACE" aria-label="Backspace">&#9003;</button>
      <button class="btn btn--operator" data-value="/" aria-label="Divide">&#247;</button>

      <!-- Row 2 -->
      <button class="btn btn--digit" data-value="7" aria-label="7">7</button>
      <button class="btn btn--digit" data-value="8" aria-label="8">8</button>
      <button class="btn btn--digit" data-value="9" aria-label="9">9</button>
      <button class="btn btn--operator" data-value="*" aria-label="Multiply">&#215;</button>

      <!-- Row 3 -->
      <button class="btn btn--digit" data-value="4" aria-label="4">4</button>
      <button class="btn btn--digit" data-value="5" aria-label="5">5</button>
      <button class="btn btn--digit" data-value="6" aria-label="6">6</button>
      <button class="btn btn--operator" data-value="-" aria-label="Subtract">&#8722;</button>

      <!-- Row 4 -->
      <button class="btn btn--digit" data-value="1" aria-label="1">1</button>
      <button class="btn btn--digit" data-value="2" aria-label="2">2</button>
      <button class="btn btn--digit" data-value="3" aria-label="3">3</button>
      <button class="btn btn--operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 5 -->
      <button class="btn btn--special" data-value="sqrt(" aria-label="Square root">&#8730;</button>
      <button class="btn btn--digit" data-value="0" aria-label="0">0</button>
      <button class="btn btn--digit" data-value="." aria-label="Decimal point">.</button>
      <button class="btn btn--equals" data-value="=" aria-label="Equals">=</button>

      <!-- Row 6: extra operators -->
      <button class="btn btn--operator btn--wide" data-value="^" aria-label="Power">x^y</button>
      <button class="btn btn--operator btn--wide" data-value="%" aria-label="Percent">%</button>
    </section>
  </main>
</body>
</html>
